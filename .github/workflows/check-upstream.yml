name: Check upstream release

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-release-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compare releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          based_on=$(node -p "require('./package.json').upstream.version")
          latest_tag=$(gh api repos/ex-machina-co/opencode-anthropic-auth/releases/latest --jq .tag_name)
          latest=${latest_tag#v}

          echo "This adaptation is based on: v${based_on}"
          echo "Latest upstream release: ${latest_tag}"

          if [ "$latest" = "$based_on" ]; then
            echo "Already aligned with the latest upstream release."
            exit 0
          fi

          title="Upstream release ${latest_tag} is available"
          existing=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "$title in:title" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            echo "Issue #${existing} already tracks ${latest_tag}."
            exit 0
          fi

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --body "A newer [ex-machina-co/opencode-anthropic-auth release](https://github.com/ex-machina-co/opencode-anthropic-auth/releases/tag/${latest_tag}) is available. This Pi adaptation is currently based on v${based_on}. Review the upstream changes, adapt them where necessary, run the offline validation suite, and only then update this package and release the matching version."

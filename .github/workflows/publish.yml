name: Publish

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check published version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if npm view "pi-claude-plan@$version" version >/dev/null 2>&1; then published=true; else published=false; fi
          {
            echo "version=$version"
            echo "published=$published"
          } >> "$GITHUB_OUTPUT"

      - if: steps.version.outputs.published != 'true'
        run: npm ci
      - if: steps.version.outputs.published != 'true'
        run: npm run check
      - if: steps.version.outputs.published != 'true'
        run: npm audit --omit=dev
      # Trusted publishing (OIDC) needs npm >= 11.5.1.
      - if: steps.version.outputs.published != 'true'
        run: npm install -g npm@^11.5.1
      - if: steps.version.outputs.published != 'true'
        run: npm publish --provenance --access public

      # Runs regardless of publish state so a failed release creation can be retried via dispatch.
      - name: Create GitHub release
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "v$VERSION" >/dev/null 2>&1 && exit 0
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
